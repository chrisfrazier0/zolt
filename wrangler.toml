name = "zolt"
compatibility_date = "2026-09-12"
main = "./worker/index.ts"

workers_dev = true
preview_urls = false

[[routes]]
pattern = "zolt.frazier.software"
custom_domain = true

[assets]
directory = "./public"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
CONTACT_TO_EMAIL = "zolt-contact@proton.me"
CONTACT_FROM_EMAIL = "Zolt Contact Form <noreply@frazier.network>"

[[d1_databases]]
binding = "DB"
database_name = "zolt-contact"
database_id = "fa1279ee-2ee2-4c7a-a6b8-09c9fb0bbae3"
