{# Atom/RSS feed icon links. Expects `feed_base`: a URL ending in "/". #}
<span class="feed-links">
  {% for feed in config.feed_filenames %}
  <a class="feed-links__link feed-links__link--{% if 'atom' in feed %}atom{% else %}rss{% endif %}" href="{{ feed_base ~ feed }}" title="{% if 'atom' in feed %}Atom{% else %}RSS{% endif %} feed" aria-label="{% if 'atom' in feed %}Atom{% else %}RSS{% endif %} feed">
    <svg class="feed-links__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <circle cx="6.18" cy="17.82" r="2.18"/>
      <path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/>
    </svg>
  </a>
  {% endfor %}
</span>
